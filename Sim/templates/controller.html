<!DOCTYPE html>
<!-- Rover Controller HTML Page
 This file creates the html structure and css styling and java script for our api controller  -->
<html>
<head>
    <title>Rover Controller</title>
</head>
<body>
    <h1>Rover Controller</h1>
<style >
    body {
        text-align: center;
    }
    button{
        font-size: 24px;
        padding: 15px;
        
    }
    #mode{
        font-size: 24px;
        padding: 10px;
        border-radius: 5px; 
        text-align:center;
        position: absolute;
        top:15px;
        right: 15px;
    }
</style>
<div id="menu-bar">
    <button id ="power" aria-label="Power">&#9211;</button>
    <button id ="play" aria-label="Play">&#9654;</button>
    <button id ="pause" aria-label="Pause">&#9208;</button>
</div>
<style>
    #directional-buttons{
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        display: grid;
        grid-template-columns: repeat(3, 70px);
        grid-template-rows: repeat(3, 70px);
        gap: 8px;
    } 
</style>

<div id="directional-buttons">
    <button id="up" aria-label="Up">&uarr;</button>
    <button id="right" aria-label="Right">&rarr;</button>
    <button id="down" aria-label="Down">&darr;</button>
    <button id="left" aria-label="Left">&larr;</button>
</div>

<style>
    #up{
        grid-row:1;
        grid-column:2;
    }
    #right{
        grid-row:2;
        grid-column:3;
    }
    #down{
        grid-row:3;
        grid-column:2;
    }
    #left{
        grid-row:2;
        grid-column:1;
    }
</style>
<select id ="mode">
    <option value="manual">Manual</option>
    <option value="autonomous">Autonomous</option>
</select>
    <script> 
        const upButton = document.getElementById("up"); // javascript to give our buttons actions
        const rightButton = document.getElementById("right");
        const downButton = document.getElementById("down");
        const leftButton = document.getElementById("left");
        const playButton = document.getElementById("play");
        const pauseButton = document.getElementById("pause");
        const logs = document.getElementById("logs");
        const mode_select = document.getElementById("mode");
    
        playButton.addEventListener("click", function () {
            fetch("/start", {
                method: "POST" 
            });
        });

        pauseButton.addEventListener("click", function () {
            fetch("/stop", {
                method: "POST"
            });
        });
        upButton.addEventListener("click", function () {
            fetch("/move", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({direction: "up"})
            });
        });
        rightButton.addEventListener("click", function () {
            fetch("/move", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({direction: "right"})
            });
        });
        downButton.addEventListener("click", function () {
            fetch("/move", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({direction: "down"})
            });
        });
        leftButton.addEventListener("click", function () {
            fetch("/move", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({direction: "left"})
            });
        });
        mode_select.addEventListener("change", function () {
            fetch("/mode", { // routes the request to the /mode endpoint in our api file 
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({mode: mode_select.value})
                
            });
        });
        
        
    </script>
</body>
</html>
